name: Nostr skill quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nostr-skill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install upstream Agent Skills validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref"
      - name: Validate portable Agent Skill package
        run: |
          mkdir -p "$RUNNER_TEMP/skill-root/nostr"
          cp SKILL.md "$RUNNER_TEMP/skill-root/nostr/SKILL.md"
          for dir in references scripts assets; do
            if [ -d "$dir" ]; then cp -R "$dir" "$RUNNER_TEMP/skill-root/nostr/$dir"; fi
          done
          skills-ref validate "$RUNNER_TEMP/skill-root/nostr"
      # websockets 15 supports host/port pinning and explicit proxy=None.
      # Keep the tested transport API stable for DNS-rebinding protection.
      - name: Install relay query dependency
        run: python -m pip install "websockets==15.0.1"
      - name: Compile Python helpers
        run: python -m py_compile scripts/nostr_key.py scripts/nostr_query.py
      - name: Run public NIP-19 safety tests
        run: python -m unittest discover -s tests -v
