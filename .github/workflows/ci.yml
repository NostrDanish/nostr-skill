name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Key toolkit selftest
        run: python3 scripts/nostr_key.py selftest
      - name: Compile query helper
        run: python3 -m py_compile scripts/nostr_query.py
